<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>WeatherGPT Smart Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>

        html,
        body,
        #map {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;
        }

        body {
            background: #e6ebf0;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        #header {

            position: absolute;

            top: 12px;
            left: 12px;
            right: 12px;

            z-index: 1000;

            padding: 12px;

            border-radius: 16px;

            background:
                rgba(15, 23, 42, 0.94);

            color: white;

            font-family:
                Arial,
                sans-serif;

            box-shadow:
                0 4px 20px
                rgba(0,0,0,0.3);
        }

        #title {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 5px;
        }

        #location {

            font-size: 12px;

            color: #cbd5e1;
        }

        #status {

            position: absolute;

            left: 12px;
            right: 12px;
            bottom: 12px;

            z-index: 1000;

            padding: 10px 12px;

            border-radius: 14px;

            background:
                rgba(15, 23, 42, 0.94);

            color: white;

            font-family:
                Arial,
                sans-serif;

            font-size: 12px;
        }

    </style>

</head>

<body>

<div id="map"></div>

<div id="header">

    <div id="title">
        WeatherGPT Smart Map
    </div>

    <div id="location">
        Loading...
    </div>

</div>

<div id="status">
    Initializing map...
</div>

<script>

    const params =
        new URLSearchParams(
            window.location.search
        );

    const lat =
        Number(
            params.get("lat")
        ) || 16.5062;

    const lon =
        Number(
            params.get("lon")
        ) || 80.6480;

    const name =
        params.get("name")
            ? decodeURIComponent(
                params.get("name")
              )
            : "Current location";


    document
        .getElementById("location")
        .textContent =
            name +
            " • " +
            lat.toFixed(4) +
            ", " +
            lon.toFixed(4);


    function setStatus(
        message
    ) {

        document
            .getElementById("status")
            .textContent =
                message;
    }


    try {

        const map =
            L.map("map").setView(
                [
                    lat,
                    lon
                ],
                6
            );


        const osm =
            L.tileLayer(
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 19,

                    attribution:
                        "&copy; OpenStreetMap contributors"
                }
            );


        osm.addTo(map);


        L.marker(
            [
                lat,
                lon
            ]
        )
        .addTo(map)
        .bindPopup(
            "<b>" +
            name +
            "</b><br>" +
            lat.toFixed(4) +
            ", " +
            lon.toFixed(4)
        )
        .openPopup();


        setStatus(
            "🗺 Map ready • " +
            name
        );


        map.on(
            "tileerror",
            function() {

                setStatus(
                    "🗺 Map active • " +
                    "Map tiles are unavailable."
                );
            }
        );

    } catch (error) {

        setStatus(
            "Map error: " +
            error.message
        );

        console.error(
            error
        );
    }

</script>

</body>
</html>
