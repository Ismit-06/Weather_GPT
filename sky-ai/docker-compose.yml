version: '3.8'

services:
  sky-ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathergpt-sky-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - SKY_CONFIDENCE_THRESHOLD=0.80
      - WORKERS=2
    volumes:
      - ./checkpoints:/app/checkpoints:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
