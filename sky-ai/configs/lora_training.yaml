# LoRA / PEFT Fine-Tuning Configuration for WeatherGPT Sky AI
# Base Model: Google Gemma 4 26B A4B Multimodal
# Objective: Hard-negative discrimination (bedsheet/ceiling/fabric vs genuine outdoor sky)

model:
  base_model_name_or_path: "google/gemma-4-26b-a4b-it"
  torch_dtype: "bfloat16"
  use_flash_attention_2: true
  trust_remote_code: true

dataset:
  train_file: "dataset/train.jsonl"
  validation_file: "dataset/validation.jsonl"
  test_file: "dataset/test/labels.jsonl"         # Evaluation only - strictly LOCKED
  nightmare_file: "dataset/nightmare/labels.jsonl" # Evaluation only - strictly LOCKED
  max_seq_length: 2048
  image_resolution: [448, 448]

augmentation:
  enabled: true
  random_crop_scale: [0.85, 1.0]
  horizontal_flip_prob: 0.5                      # Safe for isotropic sky & fabrics
  vertical_flip_prob: 0.0                        # Disabled: preserves gravity/horizon orientation
  brightness_jitter: 0.15
  contrast_jitter: 0.15
  saturation_jitter: 0.10
  jpeg_compression_quality: [60, 95]
  gaussian_blur_prob: 0.10

peft_lora:
  r: 16                                          # LoRA rank
  lora_alpha: 32                                 # LoRA scaling factor
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:                                # Vision-language projection and attention heads
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
    - "mm_projector"                             # Multimodal projection bridge

training_args:
  output_dir: "models/weathergpt_sky_ai_lora"
  num_train_epochs: 5
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  weight_decay: 0.01
  warmup_ratio: 0.06
  lr_scheduler_type: "cosine"
  bf16: true
  fp16: false
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  seed: 42
