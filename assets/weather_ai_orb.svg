<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 230" width="100%" height="230">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A10" />
      <stop offset="50%" stop-color="#0B1322" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <!-- Ambient Glow behind Orb -->
    <radialGradient id="ambientOrbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.45">
        <animate attributeName="stop-opacity" values="0.45;0.65;0.35;0.55;0.45" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Spherical Core -->
    <radialGradient id="sphere3D" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="16%" stop-color="#67E8F9" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="80%" stop-color="#075985" />
      <stop offset="100%" stop-color="#03223A" />
    </radialGradient>

    <!-- Metric Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131D2E" />
      <stop offset="100%" stop-color="#0B111C" />
    </linearGradient>

    <!-- Card Top Border Glow -->
    <linearGradient id="borderSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>

  <style>
    text {
      user-select: none;
    }
    .headline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 800;
      fill: #F8FAFC;
      font-size: 24px;
      letter-spacing: -0.4px;
    }
    .subtext {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 500;
      fill: #94A3B8;
      font-size: 13px;
    }
    .card-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 9.5px;
      letter-spacing: 0.6px;
      fill: #64748B;
    }
    .card-val {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 800;
      font-size: 14px;
    }
    .card-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #94A3B8;
    }
    .mono-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 10px;
    }
  </style>

  <!-- Outer Frame -->
  <rect width="940" height="230" rx="20" fill="url(#bgGradient)" />
  <rect width="940" height="230" rx="20" fill="none" stroke="url(#borderSheen)" stroke-width="1.2" />

  <!-- ================= ORB SECTION ================= -->
  <!-- Ambient Backlight -->
  <circle cx="125" cy="115" r="100" fill="url(#ambientOrbGlow)" filter="url(#ambientBlur)">
    <animate attributeName="r" values="90;115;90" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Track 1: Outer telemetry ring -->
  <circle cx="125" cy="115" r="74" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,7" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 125 115" to="360 125 115" dur="28s" repeatCount="indefinite" />
  </circle>

  <!-- Track 2: Segmented cyan ring -->
  <circle cx="125" cy="115" r="56" fill="none" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="14,10" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="360 125 115" to="0 125 115" dur="15s" repeatCount="indefinite" />
  </circle>

  <!-- Track 3: Inner violet ring -->
  <circle cx="125" cy="115" r="42" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-dasharray="5,5" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 125 115" to="360 125 115" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Rotating Satellites -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 125 115" to="360 125 115" dur="6.5s" repeatCount="indefinite" />
    <circle cx="181" cy="115" r="3" fill="#38BDF8" filter="url(#coreGlow)" />
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 125 115" to="-180 125 115" dur="10s" repeatCount="indefinite" />
    <circle cx="69" cy="115" r="2.2" fill="#00E676" />
  </g>

  <!-- 3D Core Sphere -->
  <circle cx="125" cy="115" r="31" fill="url(#sphere3D)" filter="url(#coreGlow)">
    <animate attributeName="r" values="30;33.5;29.5;32.5;30" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Specular Highlights -->
  <ellipse cx="116" cy="104" rx="8" ry="4.5" fill="#FFFFFF" opacity="0.75" />
  <circle cx="119" cy="105" r="2" fill="#FFFFFF" opacity="0.95" />

  <!-- ================= HEADER SECTION ================= -->
  <!-- Pill Badges -->
  <g transform="translate(245, 24)">
    <rect x="0" y="0" width="82" height="22" rx="11" fill="#052E16" stroke="#16A34A" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="15" fill="#4ADE80" class="mono-tag" letter-spacing="0.8">AI LIVE</text>

    <rect x="92" y="0" width="138" height="22" rx="11" fill="#172554" stroke="#2563EB" stroke-width="1" />
    <text x="103" y="15" fill="#93C5FD" class="mono-tag" letter-spacing="0.5">MULTIMODAL FUSION</text>
  </g>

  <!-- Main Headline -->
  <text x="245" y="78" class="headline">WeatherAI Multimodal Engine</text>

  <!-- Subtitle -->
  <text x="245" y="99" class="subtext">
    Autonomous Edge-Cloud Fusion of <tspan fill="#38BDF8">Gemma 4 Vision</tspan> • <tspan fill="#F59E0B">Sarvam Indic Voice</tspan> • <tspan fill="#00E676">124 CWC Dams</tspan>
  </text>

  <!-- ================= 3 SEPARATE CARDS WITH EXPLICIT COORDINATES ================= -->
  <!-- CARD 1: INFERENCE SPEED (x=245) -->
  <g transform="translate(245, 120)">
    <rect x="0" y="0" width="200" height="48" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="19" class="card-label">INFERENCE SPEED</text>
    <text x="14" y="38" fill="#38BDF8" class="card-val">&lt; 50ms <tspan class="card-sub">FastPath</tspan></text>
  </g>

  <!-- CARD 2: CWC FLOOD TELEMETRY (x=460) -->
  <g transform="translate(460, 120)">
    <rect x="0" y="0" width="230" height="48" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="19" class="card-label">ALL-INDIA FLOOD TELEMETRY</text>
    <text x="14" y="38" fill="#00E676" class="card-val">124 Dams <tspan class="card-sub">• 31 States &amp; UTs</tspan></text>
  </g>

  <!-- CARD 3: MULTILINGUAL VOICE (x=705) -->
  <g transform="translate(705, 120)">
    <rect x="0" y="0" width="210" height="48" rx="10" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="19" class="card-label">MULTILINGUAL VOICE</text>
    <text x="14" y="38" fill="#F59E0B" class="card-val">12 Languages <tspan class="card-sub">ASR + TTS</tspan></text>
  </g>

  <!-- ================= AUDIO STREAM FOOTER ================= -->
  <g transform="translate(245, 185)">
    <text x="0" y="15" fill="#64748B" class="mono-tag" letter-spacing="0.8">VOICE NEURAL STREAM</text>

    <g transform="translate(148, 2)">
      <rect x="0" y="4" width="3.5" height="13" rx="1.75" fill="#38BDF8">
        <animate attributeName="height" values="7;18;5;16;7" dur="1s" repeatCount="indefinite" />
        <animate attributeName="y" values="7;1.5;8;2.5;7" dur="1s" repeatCount="indefinite" />
      </rect>
      <rect x="7.5" y="2" width="3.5" height="17" rx="1.75" fill="#00D2FF">
        <animate attributeName="height" values="15;6;19;8;15" dur="0.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="3;7.5;1;6.5;3" dur="0.8s" repeatCount="indefinite" />
      </rect>
      <rect x="15" y="5" width="3.5" height="11" rx="1.75" fill="#818CF8">
        <animate attributeName="height" values="6;17;5;19;6" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="7.5;2;8;1;7.5" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="22.5" y="1" width="3.5" height="19" rx="1.75" fill="#00E676">
        <animate attributeName="height" values="17;9;21;7;17" dur="0.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="2;6;0;7;2" dur="0.9s" repeatCount="indefinite" />
      </rect>
      <rect x="30" y="3" width="3.5" height="15" rx="1.75" fill="#F59E0B">
        <animate attributeName="height" values="8;18;6;15;8" dur="1.05s" repeatCount="indefinite" />
        <animate attributeName="y" values="6.5;1.5;7.5;3;6.5" dur="1.05s" repeatCount="indefinite" />
      </rect>
      <rect x="37.5" y="2" width="3.5" height="17" rx="1.75" fill="#38BDF8">
        <animate attributeName="height" values="16;5;18;9;16" dur="0.85s" repeatCount="indefinite" />
        <animate attributeName="y" values="2.5;8;1.5;6;2.5" dur="0.85s" repeatCount="indefinite" />
      </rect>
      <rect x="45" y="6" width="3.5" height="9" rx="1.75" fill="#818CF8">
        <animate attributeName="height" values="5;15;6;17;5" dur="1.15s" repeatCount="indefinite" />
        <animate attributeName="y" values="8;3;7.5;2;8" dur="1.15s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
